[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mohh"
version = "0.1.0"
description = "Grammatical-evolution hyper-heuristic that generates multi-objective variation operators"
authors = [
    { name = "Adrian M.", email = "adrian.im0502@gmail.com" }
]
requires-python = ">3.10"
dependencies = [
    "numpy>=2.0",
    "pymoo>=0.6.1",
    "matplotlib>=3.9",
    "pandas>=2.3",
    "tqdm>=4.67",
]

[project.optional-dependencies]
# Busqueda con LLM (LLaMEA) en lugar de gramatica. Instalar con:
#   pip install -e ".[llamea]"
llamea = [
    "llamea==1.4.0",
    "openai>=1.99.1,<2",
    "huggingface_hub>=0.24",
]
# Servidor de inferencia en GPU (solo en la maquina/nodo con GPU). Pesado.
vllm = [
    "vllm>=0.6.3",
]
# Servidor de desarrollo local sin GPU/vLLM (transformers + fastapi).
local-server = [
    "transformers>=4.49",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
dev = [
    "pytest>=7.4",
]

[project.scripts]
mohh-generate = "mohh.cli:generate"
mohh-evaluate = "mohh.cli:evaluate"
mohh-run = "mohh.cli:run_full"
mohh-llamea = "mohh.llamea.run:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mohh"]
